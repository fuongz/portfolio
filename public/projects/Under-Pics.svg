<!--
  under.pics — the brand mark. THIS FILE IS THE SOURCE OF TRUTH for every icon the
  monorepo ships: `bun run icons` rasterizes it into the extension's toolbar PNGs
  and the web app's favicon set. Edit the artwork here, nowhere else.

  A Figma export, tidied: the 512-wide clip path is gone (nothing paints outside
  the tile), and the glyph's one-stop gradient — which renders as a flat colour —
  is the flat colour it always was.

  ROUNDED variant — the tile carries its own corners and everything outside
  them is transparent. This is the one for a toolbar, a favicon, a listing:
  surfaces that draw the icon as-is and would otherwise show a white box.
-->
